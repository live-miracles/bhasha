name: Deploy

# Auto-deploy on every push to main:
#   typecheck + unit tests (gate)  ->  apply D1 migrations  ->  deploy Worker
#   ->  build web  ->  deploy Pages.
# A failing gate stops the job before anything reaches production.
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit, D1:Edit,
#                            Cloudflare Pages:Edit, Workers Routes:Edit,
#                            Account Settings:Read (the "Edit Cloudflare Workers"
#                            template + D1 + Pages covers this).
#   CLOUDFLARE_ACCOUNT_ID  - your Cloudflare account id.
# Required GitHub variable:
#   CF_PAGES_PROJECT       - the Cloudflare Pages project name for apps/web.
#
# The Worker's RUNTIME secrets (ADMIN_PASSWORD_HASH, TRANSLATOR_*, REALTIME/TURN,
# etc.) already live on the Worker via `wrangler secret put` and are NOT touched
# by `wrangler deploy`, so CI never needs them.

on:
  # AUTO-DEPLOY DISABLED for the event window (~2026-06-26): a push:main restarts
  # every Durable Object (relay rebuild -> relayVersion bump -> mass listener re-pull).
  # Deploys are MANUAL ONLY during the freeze -- trigger via the Actions tab
  # ("Run workflow") or `gh workflow run Deploy --ref main`.
  # RE-ENABLE after the event by uncommenting the two lines below.
  # push:
  #   branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Gate: nothing below runs unless these pass ----
      - name: Typecheck
        run: npm run typecheck --workspaces

      - name: Unit tests
        run: npm test --workspaces

      # ---- Deploy: API (D1 migrations first, then the Worker) ----
      - name: Apply D1 migrations (remote/production)
        run: npx wrangler d1 migrations apply bhasha-dev --remote --config apps/api/wrangler.jsonc

      # Relay master switch. The relay is now the ALWAYS-ON listener-isolation path
      # (no direct fallback), so it defaults ON: the repo variable RELAY_ENABLED
      # (Settings -> Variables) only DISABLES it when set to the explicit string
      # "false"; unset or anything else => "true". This removes the footgun where an
      # accidentally-unset var would silently disable relay mid-event and restore the
      # translator-reconnect cascade. Relay benefits only the partytracks listener,
      # so VITE_USE_PARTYTRACKS likewise defaults ON (the warning below catches a mismatch).
      - name: Warn if relay disabled but partytracks enabled
        if: ${{ vars.RELAY_ENABLED == 'false' && vars.VITE_USE_PARTYTRACKS != 'false' }}
        run: echo "::warning::RELAY_ENABLED=false (relay disabled) but VITE_USE_PARTYTRACKS!=false - listeners will use the direct path and a translator reconnect will cascade to all listeners. This is unsafe at scale; only disable relay deliberately."

      - name: Deploy Worker
        run: npx wrangler deploy --config apps/api/wrangler.jsonc --var "RELAY_ENABLED:$RELAY_ENABLED"
        env:
          # Default ON: only an explicit "false" disables; unset/anything-else => true.
          RELAY_ENABLED: ${{ vars.RELAY_ENABLED == 'false' && 'false' || 'true' }}

      # ---- Deploy: web (Cloudflare Pages) ----
      # VITE_USE_PARTYTRACKS toggles the realtime client at build time. It now
      # defaults ON (the partytracks listener is the relay-isolated path); only an
      # explicit "false" repo variable builds the hand-rolled SFU client.
      - name: Build web
        run: npm run build --workspace apps/web
        env:
          # Default ON: only an explicit "false" disables; unset/anything-else => true.
          VITE_USE_PARTYTRACKS: ${{ vars.VITE_USE_PARTYTRACKS == 'false' && 'false' || 'true' }}

      - name: Deploy Pages
        run: npx wrangler pages deploy apps/web/dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch=main
